<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto | Panela Oro Miel</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/script.js"></script>
</head>
<body>
  <header data-site-header></header>
  <main class="container section narrow">
    <p class="eyebrow">Estamos para ayudarte</p>
    <h1>Hablemos</h1>
    <div class="card contact-details">
      <p><strong>Teléfonos:</strong> <a href="tel:+573178852768">317 885 2768</a> · <a href="tel:+573115366702">311 536 6702</a></p>
      <p><strong>Correo:</strong> <a href="mailto:panelapp2016@gmail.com">panelapp2016@gmail.com</a></p>
      <p><strong>Dirección:</strong> Puente Aranda, Bogotá, Colombia.</p>
    </div>

    <!-- En modo local, el formulario prepara un correo; el navegador no lo envía por sí solo. -->
    <form class="form" data-contact-form>
      <label>Nombre<input name="nombre" required maxlength="120" autocomplete="name"></label>
      <label>Correo electrónico<input name="correo" type="email" required autocomplete="email"></label>
      <label>¿Cómo podemos ayudarte?<textarea name="mensaje" required maxlength="2000"></textarea></label>
      <button class="button" type="submit">Preparar mensaje</button>
      <p class="notice" aria-live="polite"></p>
      <small>Al continuar se abrirá un borrador en tu aplicación de correo para que puedas enviarlo.</small>
    </form>
  </main>
  <footer data-site-footer></footer>
</body>
</html>
