<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro | PanelApp</title><link rel="stylesheet" href="css/style.css"><script defer src="js/script.js"></script></head><body><header data-site-header></header><main class="container section narrow"><h1>Crear cuenta de cliente</h1><form class="form" data-auth-form data-action="register"><label>Nombre<input name="nombre" required maxlength="120"></label><label>Correo<input name="correo" type="email" required maxlength="190"></label><label>Contraseña<input name="password" type="password" required minlength="8" autocomplete="new-password"><small>Mínimo 8 caracteres.</small></label><button class="button">Crear cuenta</button><p class="notice" aria-live="polite"></p></form></main><footer data-site-footer></footer></body></html>
