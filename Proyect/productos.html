<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productos | Oro Miel</title><link rel="stylesheet" href="css/style.css"><script defer src="js/script.js"></script></head><body><header data-site-header></header><main class="container section"><h1>Catálogo de productos</h1><p>Productos y disponibilidad actualizados desde PanelApp.</p><section class="product-grid" data-product-list><p>Inicia sesión para consultar el catálogo.</p></section><section class="admin-only" data-product-admin hidden><h2>Administrar productos</h2><form class="form" data-product-form><input type="hidden" name="id"><label>Nombre<input name="nombre" required maxlength="140"></label><label>Descripción<textarea name="descripcion"></textarea></label><label>Precio (COP)<input name="precio" type="number" min="0" step="0.01" required></label><label>Stock<input name="stock" type="number" min="0" step="1" required></label><label>Imagen del producto<input name="imagen_file" type="file" accept="image/png,image/jpeg,image/webp"><small>JPG, PNG o WebP; máximo 5 MB. Administrador solamente.</small></label><label>Estado<select name="estado"><option>ACTIVO</option><option>INACTIVO</option></select></label><button class="button">Guardar producto</button><button type="reset" class="button button-light">Limpiar</button><p class="notice" aria-live="polite"></p></form><div class="table-wrap"><table><thead><tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead><tbody data-product-table></tbody></table></div></section></main><footer data-site-footer></footer></body></html>
